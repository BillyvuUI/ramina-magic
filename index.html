<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf5f1"><title>Мир Рамины</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./ui/v2-game.css"></head>
<body class="game-body"><main id="appShell" class="game-shell">
  <header class="game-topbar"><a class="game-brand" href="#" aria-label="Мир Рамины">✧ <span>RAMINA <small>MAGIC</small></span></a><div class="coin-pill" aria-label="Баланс Крузейриков"><span>✦</span> <b id="balance">—</b><small>Крузейриков</small></div><button id="parentOpen" class="parent-key" aria-label="Родительский режим">⚿</button></header>
  <section class="tab-panel active" id="mainTab"><div id="gameHome"></div><div class="secondary-actions"><button data-game-action="shop">🎀 Магазин</button><button data-game-action="history">✧ История</button><button data-game-action="archive">☾ Месяцы</button></div></section>
  <section class="tab-panel" id="sportTab"><div id="sportSchedule"></div></section>
  <section class="tab-panel" id="homeTab"><div id="homeSchedule"></div></section>
  <p id="gameMessage" class="game-message" role="status"></p>
  <p id="partialStart" class="gentle-note"></p><section id="enrollment" hidden><p>Не удалось подключиться. Проверьте интернет и попробуйте ещё раз.</p><button id="connect">Повторить подключение</button></section><button id="retry" class="sync-retry">Проверить сохранение</button><p id="status" class="game-message" role="status">Подключение…</p><aside id="updateBanner" class="update-banner" hidden>Доступна новая версия приложения <button>Безопасно обновить</button></aside>
  <nav class="game-nav" aria-label="Основная навигация"><button data-tab="main" class="active" aria-current="page"><span>✧</span>Главная</button><button data-tab="sport"><span>☀</span>Спорт</button><button data-tab="home"><span>⌂</span>Дом</button></nav>
</main>
<dialog id="parentGate" class="game-dialog"><form id="parentForm"><h2>Родительский режим</h2><label>PIN<input class="field" name="pin" type="password" inputmode="numeric" maxlength="8" minlength="4" autocomplete="off" required></label><button type="submit" class="game-primary">Открыть</button><button type="button" onclick="this.closest('dialog').close()">Отмена</button></form></dialog>
<dialog id="gameDialog" class="game-dialog"></dialog><dialog id="rewardCeremony" class="game-dialog ceremony" aria-label="Твой подарок"></dialog>
<div id="v2ModalOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Библиотека и расписание"><div id="v2ModalCard" class="modal"></div></div>
<script type="module" src="./ui/v2-production-entry.mjs"></script></body></html>
